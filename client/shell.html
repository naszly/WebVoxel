<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>WebVoxel</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
      background: #060708;
      color: #e0e0e0;
    }

    .emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
    div.emscripten { text-align: center; }
    div.emscripten_border { border: 1px solid black; }
    /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
    canvas.emscripten { border: 0 none; background-color: black; }

    canvas.emscripten:focus,
    canvas.emscripten:focus-visible {
      outline: 1px solid #3399FF;
      box-shadow: 0 0 4px #3399FF;
    }

    .spinner {
      height: 16px;
      width: 16px;
      margin: 4px;
      display: inline-block;
      vertical-align: top;

      -webkit-animation: rotation .8s linear infinite;
      -moz-animation: rotation .8s linear infinite;
      -o-animation: rotation .8s linear infinite;
      animation: rotation 0.8s linear infinite;

      border-left: 5px solid rgb(235, 235, 235);
      border-right: 5px solid rgb(235, 235, 235);
      border-bottom: 5px solid rgb(235, 235, 235);
      border-top: 5px solid rgb(120, 120, 120);

      border-radius: 100%;
      background-color: rgb(51, 153, 255);
    }

    @-webkit-keyframes rotation {
      from {transform: rotate(0deg);}
      to {transform: rotate(360deg);}
    }
    @-moz-keyframes rotation {
      from {transform: rotate(0deg);}
      to {transform: rotate(360deg);}
    }
    @-o-keyframes rotation {
      from {transform: rotate(0deg);}
      to {transform: rotate(360deg);}
    }
    @keyframes rotation {
      from {transform: rotate(0deg);}
      to {transform: rotate(360deg);}
    }

    #status { display: block; margin: 0 auto; font-weight: bold; color: rgb(120, 120, 120); }

    #progress { height: 20px; width: 300px; }

    #header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0;
      padding: 6px 10px;
      background: linear-gradient(180deg, rgba(0,0,0,0.4), rgba(0,0,0,0));
      pointer-events: none;
    }
    #header button,
    #header input[type="button"] { pointer-events: auto; }

    button, input[type="button"] {
      background-color: #222;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 2px;
      padding: 4px 8px;
      margin: 2px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover, input[type="button"]:hover { background-color: #333; }

    #controls-doc {
      margin: 10px auto 16px;
      max-width: 640px;
      background: #0b0d10;
      border: 1px solid #1c1f24;
      border-radius: 6px;
      padding: 8px 12px;
      color: #cfd8dc;
      text-align: left;
    }
    #controls-doc h3 { margin: 0 0 6px; color: #9ecbff; font-size: 16px; font-weight: 600; }
    #controls-doc ul { margin: 6px 0 0 18px; padding: 0; }
    #controls-doc li { margin: 2px 0; }

    html.no-scroll, body.no-scroll { overflow: hidden; height: 100%; }
  </style>
</head>
<body>

<div>
  <div id="header">
    <div class="spinner" id="spinner"></div>
    <div class="emscripten" id="status">Downloading...</div>
    <span>
      <input type="button" value="Fullscreen" onclick="Module.requestFullscreen()">
    </span>
  </div>

  <div class="emscripten">
    <progress value="0" max="100" id="progress" hidden="hidden"></progress>
  </div>
</div>

<div class="emscripten_border">
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
</div>

<div id="model-buttons" style="text-align: center; margin: 10px;">
  <button onclick="goProcedural(true)">Procedural (Caves On)</button>
  <button onclick="goProcedural(false)">Procedural (Caves Off)</button>
  <button onclick="setModelIndex(0)">Model 0</button>
  <button onclick="setModelIndex(1)">Model 1</button>
  <button onclick="setModelIndex(2)">Model 2</button>
  <button onclick="setModelIndex(3)">Model 3</button>
</div>

<!-- Controls documentation under model-buttons -->
<div id="controls-doc" class="emscripten">
  <h3>Controls</h3>
  <ul>
    <li>Click once to lock cursor; press E to unlock</li>
    <li>Mouse: look around</li>
    <li>Left click: remove voxel</li>
    <li>Right click: place voxel</li>
    <li>W/A/S/D: move</li>
    <li>Space: jump</li>
    <li>Shift: sprint</li>
  </ul>
</div>

<script type="text/javascript">
  const statusElement = document.getElementById('status');
  const progressElement = document.getElementById('progress');
  const spinnerElement = document.getElementById('spinner');

  let urlParams = new URLSearchParams(window.location.search);

  Module = {
    arguments: [],
    canvas: (() => {
      const canvas = document.getElementById('canvas');
      canvas.addEventListener("webglcontextlost", (e) => {
        alert('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);
      return canvas;
    })(),
    setStatus: (text) => {
      Module.setStatus.last ??= {time: Date.now(), text: ''};
      if (text === Module.setStatus.last.text) return;
      const m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      const now = Date.now();
      if (m && now - Module.setStatus.last.time < 30) return;
      Module.setStatus.last.time = now;
      Module.setStatus.last.text = text;
      if (m) {
        text = m[1];
        progressElement.value = parseInt(m[2]) * 100;
        progressElement.max = parseInt(m[4]) * 100;
        progressElement.hidden = false;
        spinnerElement.hidden = false;
      } else {
        progressElement.value = null;
        progressElement.max = null;
        progressElement.hidden = true;
        if (!text) spinnerElement.style.display = 'none';
      }
      statusElement.innerHTML = text;
    },
    totalDependencies: 0,
    monitorRunDependencies: (left) => {
      this.totalDependencies = Math.max(this.totalDependencies, left);
      Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
    }
  };
  Module.setStatus('Downloading...');
  window.onerror = () => {
    Module.setStatus('Exception thrown, see JavaScript console');
    spinnerElement.style.display = 'none';
    Module.setStatus = (text) => { if (text) console.error('[post-exception status] ' + text); };
  };

  let width = urlParams.get('width') || 1440;
  let height = urlParams.get('height') || 720;
  let modelIndex = urlParams.get('modelIndex');
  let caves = urlParams.get('caves');

  Module.arguments.push('--width=' + width.toString());
  Module.arguments.push('--height=' + height.toString());

  if (modelIndex !== null) {
    Module.arguments.push('--modelIndex=' + modelIndex.toString());
  }

  if (caves !== null) {
    Module.arguments.push('--caves=' + caves.toString());
  }

  function setModelIndex(index) {
    const urlParams = new URLSearchParams(window.location.search);
    if (index === null) {
      urlParams.delete('modelIndex');
    } else {
      urlParams.set('modelIndex', index);
      urlParams.delete('caves');
    }
    window.location.search = urlParams.toString();
  }

  function goProcedural(cavesEnabled) {
    const urlParams = new URLSearchParams(window.location.search);
    urlParams.delete('modelIndex');
    urlParams.set('caves', cavesEnabled ? 'true' : 'false');
    window.location.search = urlParams.toString();
  }

  // Disable all scrolling and scroll to top when canvas has pointer lock
  (function setupScrollLockOnPointerLock() {
    const canvas = document.getElementById('canvas');
    if (!canvas) return;

    const scrollKeys = new Set(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','PageUp','PageDown','Home','End']);
    let wheelHandler = null;
    let touchHandler = null;
    let keydownHandler = null;

    function isPointerLocked() {
      const el = document.pointerLockElement || document.mozPointerLockElement || document.webkitPointerLockElement;
      return el === canvas;
    }

    function onKeydown(e) {
      // Block typical scroll keys while locked
      if (scrollKeys.has(e.code) || e.key === ' ' || e.keyCode === 32) {
        e.preventDefault();
      }
    }

    function enableScrollLock() {
      // Scroll to the top (and left) when lock engages
      window.scrollTo(0, 0);
      document.documentElement.classList.add('no-scroll');
      document.body.classList.add('no-scroll');

      wheelHandler = (e) => e.preventDefault();
      touchHandler = (e) => e.preventDefault();
      keydownHandler = onKeydown;

      window.addEventListener('wheel', wheelHandler, { passive: false });
      window.addEventListener('touchmove', touchHandler, { passive: false });
      document.addEventListener('keydown', keydownHandler, { passive: false });
    }

    function disableScrollLock() {
      document.documentElement.classList.remove('no-scroll');
      document.body.classList.remove('no-scroll');

      if (wheelHandler) window.removeEventListener('wheel', wheelHandler, { passive: false });
      if (touchHandler) window.removeEventListener('touchmove', touchHandler, { passive: false });
      if (keydownHandler) document.removeEventListener('keydown', keydownHandler, { passive: false });
      wheelHandler = touchHandler = keydownHandler = null;
    }

    function handleChange() {
      if (isPointerLocked()) enableScrollLock();
      else disableScrollLock();
    }

    document.addEventListener('pointerlockchange', handleChange);
    document.addEventListener('mozpointerlockchange', handleChange);
    document.addEventListener('webkitpointerlockchange', handleChange);

    // If already locked on load
    if (isPointerLocked()) enableScrollLock();
  })();
</script>
{{{ SCRIPT }}}
</body>
</html>
