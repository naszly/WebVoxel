<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>WebVoxel</title>
  <style>
    body {
      font-family: arial;
      margin: 0;
      padding: 0;
      background: #060708;
      color: #e0e0e0;
    }

    .emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
    div.emscripten { text-align: center; }
    div.emscripten_border { border: 1px solid black; }
    /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
    canvas.emscripten { border: 0 none; background-color: black; }

    canvas.emscripten:focus,
    canvas.emscripten:focus-visible {
      outline: 2px solid #3399FF;
      box-shadow: 0 0 8px #3399FF;
    }

    .spinner {
      height: 16px;
      width: 16px;
      margin: 4px;
      display: inline-block;
      vertical-align: top;

      -webkit-animation: rotation .8s linear infinite;
      -moz-animation: rotation .8s linear infinite;
      -o-animation: rotation .8s linear infinite;
      animation: rotation 0.8s linear infinite;

      border-left: 5px solid rgb(235, 235, 235);
      border-right: 5px solid rgb(235, 235, 235);
      border-bottom: 5px solid rgb(235, 235, 235);
      border-top: 5px solid rgb(120, 120, 120);

      border-radius: 100%;
      background-color: rgb(51, 153, 255);
    }

    @-webkit-keyframes rotation {
      from {-webkit-transform: rotate(0deg);}
      to {-webkit-transform: rotate(360deg);}
    }
    @-moz-keyframes rotation {
      from {-moz-transform: rotate(0deg);}
      to {-moz-transform: rotate(360deg);}
    }
    @-o-keyframes rotation {
      from {-o-transform: rotate(0deg);}
      to {-o-transform: rotate(360deg);}
    }
    @keyframes rotation {
      from {transform: rotate(0deg);}
      to {transform: rotate(360deg);}
    }

    #status {
      display: block;
      margin: 0 auto;
      font-weight: bold;
      color: rgb(120, 120, 120);
    }

    #progress {
      height: 20px;
      width: 300px;
    }

    #controls {
      display: flex;
      justify-content: center;
    }

    button, input[type="button"] {
      background-color: #222;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 2px;
      padding: 4px 8px;
      margin: 2px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover, input[type="button"]:hover {
      background-color: #333;
    }
  </style>
</head>
<body>

<div>
  <div class="spinner" id="spinner"></div>
  <div class="emscripten" id="status">Downloading...</div>

  <span id="controls" style="margin: 8px">
    <span>
      <input type="button" value="Fullscreen" onclick="Module.requestFullscreen()">
    </span>
  </span>

  <div class="emscripten">
    <progress value="0" max="100" id="progress" hidden="hidden"></progress>
  </div>
</div>

<div class="emscripten_border">
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
</div>

<div id="model-buttons" style="text-align: center; margin: 10px;">
  <button onclick="setModelIndex(null)">Procedural</button>
  <button onclick="setModelIndex(0)">Model 0</button>
  <button onclick="setModelIndex(1)">Model 1</button>
  <button onclick="setModelIndex(2)">Model 2</button>
  <button onclick="setModelIndex(3)">Model 3</button>
</div>

<script type="text/javascript">
  const statusElement = document.getElementById('status');
  const progressElement = document.getElementById('progress');
  const spinnerElement = document.getElementById('spinner');

  let urlParams = new URLSearchParams(window.location.search);

  Module = {
    arguments: [],
    canvas: (() => {
      const canvas = document.getElementById('canvas');

      // As a default initial behavior, pop up an alert when webgl context is lost. To make your
      // application robust, you may want to override this behavior before shipping!
      // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
      canvas.addEventListener("webglcontextlost", (e) => {
        alert('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);

      return canvas;
    })(),
    setStatus: (text) => {
      Module.setStatus.last ??= {time: Date.now(), text: ''};
      if (text === Module.setStatus.last.text) return;
      const m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      const now = Date.now();
      if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
      Module.setStatus.last.time = now;
      Module.setStatus.last.text = text;
      if (m) {
        text = m[1];
        progressElement.value = parseInt(m[2]) * 100;
        progressElement.max = parseInt(m[4]) * 100;
        progressElement.hidden = false;
        spinnerElement.hidden = false;
      } else {
        progressElement.value = null;
        progressElement.max = null;
        progressElement.hidden = true;
        if (!text) spinnerElement.style.display = 'none';
      }
      statusElement.innerHTML = text;
    },
    totalDependencies: 0,
    monitorRunDependencies: (left) => {
      this.totalDependencies = Math.max(this.totalDependencies, left);
      Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
    }
  };
  Module.setStatus('Downloading...');
  window.onerror = (event) => {
    Module.setStatus('Exception thrown, see JavaScript console');
    spinnerElement.style.display = 'none';
    Module.setStatus = (text) => {
      if (text) console.error('[post-exception status] ' + text);
    };
  };

  let width = urlParams.get('width') || 1280;
  let height = urlParams.get('height') || 720;
  let modelIndex = urlParams.get('modelIndex');

  if (width && height) {
    Module.arguments.push(width.toString());
    Module.arguments.push(height.toString());

    if (modelIndex) {
      Module.arguments.push(modelIndex.toString());
    }
  }

  function setModelIndex(index) {
    const urlParams = new URLSearchParams(window.location.search);
    if (index === null) {
      urlParams.delete('modelIndex');
    } else {
      urlParams.set('modelIndex', index);
    }
    window.location.search = urlParams.toString();
  }
</script>
{{{ SCRIPT }}}
</body>
</html>
