<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>WebVoxel</title>

    <style>

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #060708;
            color: #e0e0e0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .emscripten {
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            z-index: 1000;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 8px;

            padding: 6px;

            background: linear-gradient(
                    180deg,
                    rgba(0, 0, 0, .5),
                    rgba(0, 0, 0, 0)
            );

            pointer-events: none;
        }

        #header * {
            pointer-events: auto;
        }


        canvas.emscripten {

            display: block;

            width: 100vw;
            height: 100vh;

            border: 0;
            background: black;

        }


        canvas.emscripten:focus,
        canvas.emscripten:focus-visible {

            outline: 1px solid #3399ff;
            box-shadow: 0 0 5px #3399ff;

        }


        button,
        input[type="button"] {

            background: #222;
            color: #eee;

            border: 1px solid #444;
            border-radius: 3px;

            padding: 5px 12px;

            cursor: pointer;

        }


        button:hover,
        input[type="button"]:hover {

            background: #333;

        }


        .spinner {

            height: 16px;
            width: 16px;

            border-radius: 100%;

            display: inline-block;

            border-left: 5px solid #eee;
            border-right: 5px solid #eee;
            border-bottom: 5px solid #eee;
            border-top: 5px solid #777;

            animation: rotation .8s linear infinite;

        }


        @keyframes rotation {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        #status {

            font-weight: bold;

            color: #aaa;

        }


        #progress {

            width: 300px;

        }


        #room-badge {

            display: flex;
            align-items: center;
            gap: 7px;
            padding: 5px 8px;
            color: #ddd;
            background: rgba(17, 17, 17, .9);
            border: 1px solid #555;
            border-radius: 4px;

        }

        #room-badge[hidden] {
            display: none;
        }


        #room-code {

            color: #9ecbff;
            font-family: monospace;
            font-size: 1.1em;
            font-weight: bold;
            letter-spacing: .14em;
            user-select: all;

        }


        .no-scroll {

            overflow: hidden !important;

        }

    </style>

</head>


<body>


<div id="header">

    <div id="spinner"
         class="spinner"></div>


    <div id="status">
        Downloading...
    </div>


    <progress id="progress"
              value="0"
              max="100"
              hidden>
    </progress>


    <div id="room-badge" hidden>
        <span>Join code</span>
        <span id="room-code"></span>
        <button id="copy-room-code" type="button">Copy</button>
    </div>


    <input type="button"
           value="Fullscreen"
           onclick="Module.requestFullscreen()">


    <input type="button"
           value="Back"
           onclick="navigateBack();">

</div>


<canvas id="canvas"
        class="emscripten"
        oncontextmenu="event.preventDefault()"
        tabindex="-1">
</canvas>


<script>


    const statusElement =
        document.getElementById("status");


    const progressElement =
        document.getElementById("progress");


    const spinnerElement =
        document.getElementById("spinner");


    const params =
        new URLSearchParams(
            window.location.search
        );


    const world =
        params.get("world");


    const createWorld =
        params.get("create") === "true";


    const seed =
        params.get("seed");


    const caves =
        params.get("caves");


    const multiplayerMode =
        params.get("mode") === "multiplayer";


    const roomCode =
        (params.get("room") || "").trim().toUpperCase();


    const roomToken =
        (sessionStorage.getItem("webvoxel.roomToken." + roomCode) || "").trim().toUpperCase();


    const validRoomCode = /^[ABCDEFGHJKMNPQRTUVWXYZ2346789]{6}$/.test(roomCode);
    const validRoomToken = /^[A-F0-9]{32}$/.test(roomToken);


    if (multiplayerMode && validRoomCode) {
        const roomBadge = document.getElementById("room-badge");
        const roomCodeElement = document.getElementById("room-code");
        const copyRoomCodeButton = document.getElementById("copy-room-code");

        roomCodeElement.textContent = roomCode;
        roomBadge.hidden = false;

        copyRoomCodeButton.onclick = async () => {
            try {
                await navigator.clipboard.writeText(roomCode);
                copyRoomCodeButton.textContent = "Copied";
                setTimeout(() => copyRoomCodeButton.textContent = "Copy", 1500);
            } catch (_) {
                window.getSelection()?.selectAllChildren(roomCodeElement);
            }
        };
    }


    Module = {

        arguments: [],


        canvas: (() => {

            const canvas =
                document.getElementById("canvas");


            canvas.addEventListener(
                "webglcontextlost",
                (e) => {

                    alert(
                        "Graphics context lost."
                    );

                    e.preventDefault();

                },
                false
            );


            return canvas;

        })(),


        setStatus(text) {


            Module.setStatus.last ??=
                {
                    time: Date.now(),
                    text: ""
                };


            if (
                text ===
                Module.setStatus.last.text
            )
                return;


            Module.setStatus.last.text =
                text;


            const match =
                text.match(
                    /([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/
                );


            if (match) {

                progressElement.value =
                    Number(match[2]) * 100;


                progressElement.max =
                    Number(match[4]) * 100;


                progressElement.hidden =
                    false;


                spinnerElement.hidden =
                    false;


            } else {

                progressElement.hidden =
                    true;


                if (!text)
                    spinnerElement.style.display =
                        "none";

            }


            statusElement.innerHTML =
                text;

        },


        totalDependencies: 0,


        monitorRunDependencies(left) {

            this.totalDependencies =
                Math.max(
                    this.totalDependencies,
                    left
                );


            Module.setStatus(
                left
                    ?
                    "Preparing..."
                    :
                    "Ready"
            );

        }

    };


    Module.setStatus(
        "Downloading..."
    );


    let navigatingAway = false;
    let flushPendingMultiplayerEdits = null;


    function notifyNavigationAway(cancelOnPersistenceFailure = false) {

        if (navigatingAway)
            return true;

        if (flushPendingMultiplayerEdits && !flushPendingMultiplayerEdits() && cancelOnPersistenceFailure)
            return false;

        navigatingAway = true;

        try {
            if (typeof Module?.ccall === "function") {
                Module.ccall(
                    "onNavigationAway",
                    null,
                    [],
                    []
                );
            }
        } catch (_) {
            // The runtime may already be shutting down during pagehide.
        }

        return true;

    }


    function navigateBack() {

        if (!notifyNavigationAway(true))
            return;
        location.replace("index.html");

    }


    window.addEventListener(
        "pagehide",
        () => notifyNavigationAway()
    );


    window.onerror = () => {

        Module.setStatus(
            "Exception thrown, check console"
        );

        spinnerElement.style.display =
            "none";

    };


    /*
        Pass browser URL parameters to main(argc, argv).

        Example:

        game.html?world=my_world&create=true&seed=123&caves=false

        becomes:

        --world=my_world
        --create
        --seed=123
        --caves=false

        which is handled by cxxopts in main.cpp.
    */


    if (world) {
        Module.arguments.push(
            "--world=" + world
        );
    }


    if (createWorld) {
        Module.arguments.push(
            "--create"
        );
    }


    if (params.has("seed")) {
        Module.arguments.push(
            "--seed=" + seed
        );
    }


    if (params.has("caves")) {
        Module.arguments.push(
            "--caves=" + caves
        );
    }


    if (multiplayerMode) {
        if (validRoomCode) {
            Module.arguments.push("--room=" + roomCode);
        }
        if (validRoomToken) {
            Module.arguments.push("--room-token=" + roomToken);
        }
    }


    if (multiplayerMode && validRoomCode && validRoomToken) {
        Module.preRun = Module.preRun || [];
        let releaseMultiplayerStartup = null;
        Module.preRun.push(() => {
            if (joinedRoom) return;
            addRunDependency("multiplayer-room-join");
            releaseMultiplayerStartup = () => {
                if (!releaseMultiplayerStartup) return;
                releaseMultiplayerStartup = null;
                removeRunDependency("multiplayer-room-join");
            };
        });
        const recordSeparator = "\u001e";
        const tokenFingerprint = (() => {
            let hash = 14695981039346656037n;
            for (const character of roomToken) {
                hash ^= BigInt(character.charCodeAt(0));
                hash = BigInt.asUintN(64, hash * 1099511628211n);
            }
            return hash.toString(16).padStart(16, "0");
        })();
        const roomStorageKey = roomCode + "." + tokenFingerprint;
        const revisionKey = "webvoxel.roomRevision." + roomStorageKey;
        const pendingEditsKey = "webvoxel.pendingEdits." + roomStorageKey;
        const maxPendingEdits = 16384;
        const pendingEditRetentionMs = 30 * 24 * 60 * 60 * 1000;
        const maxCoordinate = 2147483583;
        const operationIdPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
        const hasValidEditPayload = edit => edit &&
            operationIdPattern.test(edit.operationId) &&
            Number.isSafeInteger(edit.x) && Math.abs(edit.x) <= maxCoordinate &&
            Number.isSafeInteger(edit.y) && Math.abs(edit.y) <= maxCoordinate &&
            Number.isSafeInteger(edit.z) && Math.abs(edit.z) <= maxCoordinate &&
            Number.isInteger(edit.blockId) && edit.blockId >= 0 && edit.blockId < 8;
        const normalizeStoredEdit = edit => {
            if (!hasValidEditPayload(edit)) return null;
            const createdAt = Number.isFinite(edit.createdAt) ? edit.createdAt : Date.now();
            return createdAt >= Date.now() - pendingEditRetentionMs ? { ...edit, createdAt } : null;
        };
        let persistenceWarningShown = false;
        const storedPendingEdits = (() => {
            try {
                const edits = JSON.parse(localStorage.getItem(pendingEditsKey) || "[]");
                if (!Array.isArray(edits)) return [];
                const validEdits = edits.map(normalizeStoredEdit).filter(Boolean).slice(-maxPendingEdits);
                if (validEdits.length !== edits.length)
                    console.warn("Discarded invalid stored multiplayer edits.");
                return validEdits;
            } catch (error) {
                console.warn("Could not restore pending multiplayer edits:", error);
                return [];
            }
        })();
        const pendingEdits = new Map(storedPendingEdits.map(edit => [edit.operationId, edit]));
        const locallyAppliedOperationIds = new Set();
        const pendingRemoteEdits = [];
        const pendingInvocations = new Map();
        const retryOperationIds = new Set();
        let roomSocket = null;
        let joinedRoom = false;
        let runtimeReady = false;
        let reconnectDelay = 500;
        let retryDelay = 1000;
        let retryTimer = null;
        let keepAliveTimer = null;
        let persistTimer = null;
        let nextInvocationId = 1;

        const sendHubMessage = message =>
            roomSocket?.readyState === WebSocket.OPEN && roomSocket.send(JSON.stringify(message) + recordSeparator);

        const flushPendingEdits = () => {
            clearTimeout(persistTimer);
            persistTimer = null;
            try {
                if (pendingEdits.size)
                    localStorage.setItem(pendingEditsKey, JSON.stringify([...pendingEdits.values()]));
                else
                    localStorage.removeItem(pendingEditsKey);
                return true;
            } catch (error) {
                console.error("Could not persist pending multiplayer edits:", error);
                if (!persistenceWarningShown) {
                    persistenceWarningShown = true;
                    alert("Pending multiplayer edits cannot be saved by this browser. Keep this page open until the connection recovers.");
                }
                return false;
            }
        };

        const persistPendingEdits = () => {
            clearTimeout(persistTimer);
            persistTimer = setTimeout(flushPendingEdits, 100);
        };

        flushPendingMultiplayerEdits = flushPendingEdits;

        const sendBlockBatch = edits => {
            if (!edits.length || !joinedRoom) return;
            const invocationId = String(nextInvocationId++);
            pendingInvocations.set(invocationId, edits.map(edit => edit.operationId));
            sendHubMessage({
                type: 1,
                invocationId,
                target: "SetBlocks",
                arguments: [edits]
            });
        };

        const sendPendingEdits = operationIds => {
            const expirationCutoff = Date.now() - pendingEditRetentionMs;
            for (const [operationId, edit] of pendingEdits) {
                if (edit.createdAt < expirationCutoff) {
                    pendingEdits.delete(operationId);
                    locallyAppliedOperationIds.delete(operationId);
                }
            }
            persistPendingEdits();
            const edits = operationIds
                ? operationIds.map(id => pendingEdits.get(id)).filter(Boolean)
                : [...pendingEdits.values()];
            for (let offset = 0; offset < edits.length; offset += 4096) {
                sendBlockBatch(edits.slice(offset, offset + 4096));
            }
        };

        const scheduleRetry = operationIds => {
            operationIds.forEach(id => retryOperationIds.add(id));
            if (retryTimer) return;
            retryTimer = setTimeout(() => {
                retryTimer = null;
                const retryIds = [...retryOperationIds];
                retryOperationIds.clear();
                if (joinedRoom) sendPendingEdits(retryIds);
                retryDelay = Math.min(retryDelay * 2, 10000);
            }, retryDelay);
        };

        const applyRemoteEdit = mutation => {
            const currentRevision = Number(sessionStorage.getItem(revisionKey) || 0);
            sessionStorage.setItem(revisionKey, String(Math.max(currentRevision, mutation.revision)));
            const wasAppliedLocally = locallyAppliedOperationIds.delete(mutation.operationId);
            pendingEdits.delete(mutation.operationId);
            persistPendingEdits();
            if (wasAppliedLocally) {
                return;
            } else if (runtimeReady) {
                Module.ccall("applyRemoteBlockEdit", null,
                    ["number", "number", "number", "number"],
                    [mutation.x, mutation.y, mutation.z, mutation.blockId]);
            } else {
                pendingRemoteEdits.push(mutation);
            }
        };

        Module.multiplayerSendBrush = (centerX, centerY, centerZ, radius, sphere, blockId) => {
            const edits = [];
            for (let x = -radius; x <= radius; ++x)
                for (let y = -radius; y <= radius; ++y)
                    for (let z = -radius; z <= radius; ++z) {
                        if (sphere && x * x + y * y + z * z > radius * radius) continue;
                        const edit = {
                            operationId: crypto.randomUUID(),
                            x: centerX + x, y: centerY + y, z: centerZ + z, blockId,
                            createdAt: Date.now()
                        };
                        edits.push(edit);
                    }
            if (pendingEdits.size + edits.length > maxPendingEdits) {
                console.error("Pending multiplayer edit limit reached; reloading the authoritative world state.");
                location.reload();
                return;
            }
            edits.forEach(edit => {
                pendingEdits.set(edit.operationId, edit);
                locallyAppliedOperationIds.add(edit.operationId);
            });
            persistPendingEdits();
            sendBlockBatch(edits);
        };

        const previousRuntimeInitialized = Module.onRuntimeInitialized;
        Module.onRuntimeInitialized = () => {
            runtimeReady = true;
            previousRuntimeInitialized?.();
            pendingRemoteEdits.splice(0).forEach(applyRemoteEdit);
        };

        const connectRoom = async () => {
            try {
                const negotiation = await fetch("/rooms-hub/negotiate?negotiateVersion=1", { method: "POST" });
                if (!negotiation.ok) throw new Error("Room negotiation failed.");
                const { connectionToken } = await negotiation.json();
                const socketUrl = new URL("/rooms-hub", location.href);
                socketUrl.protocol = location.protocol === "https:" ? "wss:" : "ws:";
                socketUrl.searchParams.set("id", connectionToken);
                roomSocket = new WebSocket(socketUrl);
                roomSocket.onopen = () => sendHubMessage({ protocol: "json", version: 1 });
                roomSocket.onmessage = event => {
                    for (const frame of event.data.split(recordSeparator)) {
                        if (!frame) continue;
                        const message = JSON.parse(frame);
                        if (message.type === 6) continue;
                        if (message.type === 1 && message.target === "BlockChanged") applyRemoteEdit(message.arguments[0]);
                        if (message.type === 1 && message.target === "BlocksChanged") message.arguments[0].forEach(applyRemoteEdit);
                        if (message.type === 1 && message.target === "BlocksAcknowledged") {
                            message.arguments[0].forEach(operationId => {
                                pendingEdits.delete(operationId);
                                locallyAppliedOperationIds.delete(operationId);
                            });
                            persistPendingEdits();
                        }
                        if (message.type === 3) {
                            const operationIds = pendingInvocations.get(message.invocationId) || [];
                            pendingInvocations.delete(message.invocationId);
                            if (message.error) scheduleRetry(operationIds);
                        }
                        if (message.type === 1 && message.target === "ResyncRequired") {
                            sessionStorage.removeItem(revisionKey);
                            location.reload();
                            return;
                        }
                        if (message.type === 1 && message.target === "RoomJoined") {
                            joinedRoom = true;
                            releaseMultiplayerStartup?.();
                            reconnectDelay = 500;
                            retryDelay = 1000;
                            clearInterval(keepAliveTimer);
                            keepAliveTimer = setInterval(() => sendHubMessage({ type: 6 }), 15000);
                            sessionStorage.setItem(revisionKey, String(Math.max(
                                Number(sessionStorage.getItem(revisionKey) || 0),
                                message.arguments[0].currentRevision)));
                            sendPendingEdits();
                        }
                        if (message.type === undefined) {
                            sendHubMessage({
                                type: 1,
                                target: "JoinRoom",
                                arguments: [roomCode, roomToken, Number(sessionStorage.getItem(revisionKey) || 0)]
                            });
                        }
                    }
                };
                roomSocket.onclose = () => {
                    joinedRoom = false;
                    pendingInvocations.clear();
                    retryOperationIds.clear();
                    clearInterval(keepAliveTimer);
                    keepAliveTimer = null;
                    clearTimeout(retryTimer);
                    retryTimer = null;
                    if (!navigatingAway) {
                        setTimeout(connectRoom, reconnectDelay);
                        reconnectDelay = Math.min(reconnectDelay * 2, 10000);
                    }
                };
            } catch (error) {
                console.error("Multiplayer connection failed:", error);
                if (!navigatingAway) setTimeout(connectRoom, reconnectDelay);
                reconnectDelay = Math.min(reconnectDelay * 2, 10000);
            }
        };
        connectRoom();
    }

    /*
        Prevent browser scrolling
        while playing.
    */


    (function () {


        const canvas =
            document.getElementById("canvas");


        const scrollKeys =
            new Set([
                "Space",
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight"
            ]);


        function locked() {

            return (
                document.pointerLockElement === canvas
            );

        }


        function key(e) {

            if (scrollKeys.has(e.code))
                e.preventDefault();

        }


        function update() {


            if (locked()) {

                document.body.classList.add(
                    "no-scroll"
                );

                window.scrollTo(0, 0);

                document.addEventListener(
                    "keydown",
                    key,
                    {passive: false}
                );

            } else {

                document.body.classList.remove(
                    "no-scroll"
                );

                document.removeEventListener(
                    "keydown",
                    key
                );

            }

        }


        document.addEventListener(
            "pointerlockchange",
            update
        );


    })();


</script>
